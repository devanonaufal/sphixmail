<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Envelope body -->
  <rect x="4" y="18" width="56" height="38" rx="5" fill="#F5C842"/>
  <!-- Envelope flap top open -->
  <path d="M4 23 L32 8 L60 23" fill="#D4A917" opacity="0.8"/>
  <!-- Letter/card inside -->
  <rect x="16" y="4" width="32" height="32" rx="5" fill="#FF6B7A"/>
  <!-- Skull head -->
  <ellipse cx="32" cy="21" rx="10" ry="9" fill="#F5E6C8"/>
  <!-- Eye sockets -->
  <ellipse cx="28" cy="20" rx="2.5" ry="2.5" fill="#5C4A3A"/>
  <ellipse cx="36" cy="20" rx="2.5" ry="2.5" fill="#5C4A3A"/>
  <!-- Nose -->
  <path d="M31 24 L32 26 L33 24 Z" fill="#5C4A3A"/>
  <!-- Jaw -->
  <rect x="26" y="27" width="12" height="5" rx="2" fill="#F5E6C8"/>
  <rect x="28.5" y="27" width="2" height="5" fill="#FF6B7A" opacity="0.6"/>
  <rect x="32" y="27" width="2" height="5" fill="#FF6B7A" opacity="0.6"/>
  <rect x="35.5" y="27" width="2" height="5" fill="#FF6B7A" opacity="0.6"/>
  <!-- Envelope bottom flap line -->
  <line x1="14" y1="50" x2="50" y2="50" stroke="#B8961A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
